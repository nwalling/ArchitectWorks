open_items:
  - kind: unresolved_reference
    ref: D-2
    cited_by: [D-3, elevations]
    effect: roof, wall, floor, footing, skylight and stone facing build-ups use the stated defaults
  - kind: missing_sheet
    what: floor plan
    effect: rooms, interior walls and doors between pavilions are not modelled; the slab between pavilions is inferred
  - kind: conflict
    what: "left chain lettering (11'-4\" / 21'-7 3/4\") against the calibrated plan (11'-8\" / 21'-11 3/4\")"
    effect: cp_core_n uses 11'-8"; check with a sharper scan
  - kind: assumption
    what: flat roofs over the halls, the music room and the stair tower
    effect: "outlines from named points on the roof plan, top scaled off the NW elevation; beams, joists, the 1/4\" per foot drainage taper and the turned-up beam ends are not modelled. D-2 has the real build-up"
  - kind: assumption
    what: music room skylight
    effect: east-west position, length, rise and gable end from the NW elevation; north-south position assumed
  - kind: assumption
    what: links between pavilions
    effect: five glazed links are modelled where the plan draws glazing; other connections (music room to the south-east pavilion, the hall walls) are not yet read
  - kind: simplification
    what: column notches, door frames, trellis, gutters, footings, stone facing beyond the dimensioned face
    effect: not modelled
