# ArchitectWorks Building Spec: phase 1, the whole example house.
#
# Hand-written from the five sheet photos in ./sheets. Lengths are copied as
# lettered on the drawings and parsed to exact fractions of an inch. Every
# value carries `src`: the sheet, the basis (dimensioned > rule > measured >
# assumed) and, where it helps a reviewer, the words on the sheet.

spec_version: "0.1"

building:
  id: example-house
  code: EH
  name: Example house (hand-drafted set, five sheets)

units: imperial
datum: ff_bedroom          # F.F. 100'-0" becomes z = 0 in Blender and Unreal

sheets:
  foundation: {title: Foundation plan, file: sheets/foundation-plan.jpg, scale: 1/4" = 1'-0", calibration: sheets/foundation-plan.calib.yaml, note: scale too small to read in the photo; fitted from the dimensions instead}
  roof: {title: Roof framing plan, file: sheets/roof-framing-plan.jpg, scale: 1/4" = 1'-0", note: carries the general notes}
  elevations: {title: Exterior elevations (southwest and northwest), file: sheets/exterior-elevations.jpg, scale: 1/4" = 1'-0", calibration: sheets/exterior-elevations.calib.yaml}
  D-1: {title: "Section D-1, typical sliding door at concrete column", file: sheets/section-d1.jpg, scale: 1" = 1'-0" and 3" = 1'-0"}
  D-3: {title: "Section D-3, typical wall at bedroom and study", file: sheets/section-d3.jpg, scale: 1" = 1'-0"}

levels:
  ff_bedroom:
    elev: 100'-0"
    src: {sheet: elevations, basis: dimensioned, quote: "F.F. @ BDRM/STUDY ELEV 100'-0\""}
  ff_music:
    elev: 98'-4"
    src: {sheet: D-3, basis: dimensioned, quote: "F.F. ELEV 98'-4\"", note: not used in phase 0}
  t_o_header:
    elev: 107'-1 1/2"
    src: {sheet: elevations, basis: dimensioned, confidence: medium, quote: "TOP OF HEADER ELEV 107'-1 1/2\"", note: lettered beside the living room pavilion}
  t_o_masonry_bedroom:
    elev: 105'-8"
    src: {sheet: D-3, basis: dimensioned, confidence: medium, quote: "5'-8\" above F.F. ELEV 100'-0\"", note: "the matching label on the SW elevation reads 105'-? in the photo"}
  t_o_ring_bedroom:
    elev: 110'-9"
    src: {sheet: elevations, basis: dimensioned, quote: "T.O. COMP. RING @ BDRM/RM ELEV 110'-9\"", note: on both elevations}
  t_o_flat_roof:
    elev: 107'-2"
    src: {sheet: D-3, basis: dimensioned, confidence: medium, quote: "5'-8\" ... 10\" ... 8\"; BUILT-UP ROOF OVER 3\" INSUL. @ MUSIC RM.; 6x8 BEAM @ MUSIC ROOM",
          note: "105'-8\" top of masonry, 10\" of sill and beam, 8\" of roof; the NW elevation scales 107'-4 1/2\""}
  u_s_flat_roof:
    elev: 106'-6"
    src: {sheet: D-3, basis: dimensioned, confidence: medium, note: "underside of the 8\" flat roof: 105'-8\" plus the 10\" of sill and 6x8 beam; walls under a flat roof are carried up to it"}
  t_o_lantern_living:
    elev: 109'-8"
    src: {sheet: elevations, basis: measured, confidence: low, quote: "FIXED GL.", note: "top of the beam over the living room's clerestory scales 109'-8\" on the SW elevation"}
  fin_grade:
    elev: 99'-7"
    src: {sheet: elevations, basis: measured, confidence: low, quote: "FIN. GRADE", note: "about 5\" under the bedroom floor where the elevations letter it; it falls toward the landing (99'-2\") and the sunken music room"}
  t_o_flue_n:
    elev: 115'-3"
    src: {sheet: elevations, basis: measured, confidence: medium, quote: "FIREPLACE FLUE", note: "top of the ball scales 114'-11 3/4\" on the SW elevation and 115'-6\" on the NW (calibrated fits)"}
  t_o_flue_s:
    elev: 114'-8"
    src: {sheet: elevations, basis: measured, confidence: medium, quote: "FIREPLACE FLUE", note: "top of the ball scales 114'-6 3/4\" on the SW elevation and 114'-9 1/2\" on the NW (calibrated fits)"}
  t_o_ring_living:
    elev: 111'-10 3/4"
    src: {sheet: elevations, basis: dimensioned, confidence: medium, quote: "T.O. COMP. RING @ L.R. ELEV 111'-10 3/4\"", note: not used in phase 0}

control:
  # Plan coordinates: X to the right of the sheet, Y up the sheet, feet and inches.
  # X = 0 is the extension line through the living room center (the top chain's
  # first full dimension); Y = 0 is the line through the north-west pavilion's center.
  cp_living:
    at: [0", -21'-0 1/2"]
    src: {sheet: foundation, basis: dimensioned, quote: "right chain: 5'-8 1/2\" + 15'-4\" below C.P. of the north-east pavilion", note: X from the top chain's zero line}
  cp_tl:
    at: [5'-8", 0"]
    src: {sheet: foundation, basis: dimensioned, quote: "top chain: 5'-8\"; right chain zero"}
  cp_tr:
    at: [26'-11 3/4", -5'-8 1/2"]
    src: {sheet: foundation, basis: dimensioned, quote: "top chain: 26'-11 3/4\"; right chain: 1'-3 1/2\" + 4'-5\" = 5'-8 1/2\""}
  cp_center:
    at: [13'-6 3/4", -28'-10 1/2"]
    src: {sheet: foundation, basis: dimensioned, quote: "bottom chain: 7'-7 3/4\" + 5'-11\" = 13'-6 3/4\"; right chain: 4'-5\" + 3'-5\" below the living room line"}
  cp_br:
    at: [25'-2 3/4", -40'-6 1/2"]
    src: {sheet: foundation, basis: dimensioned, quote: "bottom chain: 13'-6 3/4\" + 11'-8\" = 25'-2 3/4\"; right chain: 3'-5\" + 2'-4\" + 5'-11\" = 11'-8\" below the center pavilion", note: "the right chain's first 3'-5\" reads like 3'-6\" in the photo; 3'-5\" closes the 11'-8\" and is half the 6'-10\" side"}
  cp_music:
    at: [10'-6 3/4", -43'-6 1/2"]
    src: {sheet: foundation, basis: dimensioned, quote: "3'-0\" from the center pavilion's line; right chain: 3'-0\" below the south-east pavilion"}
  cp_stair:
    at: [-6'-4", -2'-11"]
    src: {sheet: foundation, basis: measured, confidence: medium, note: "center of the stair tower wall, measured on the calibrated plan"}
  cp_core_n:
    at: [14'-6", -9'-4 1/2"]
    src: {sheet: foundation, basis: measured, confidence: medium, note: "on the extension line through the north-west pavilion's east column; the left chain's 11'-8\" from the living room line (lettering reads like 11'-4\" in the photo; the calibrated plan agrees with 11'-8\" to 1/2\")"}
  cp_core_s:
    at: [16'-10 3/4", -36'-8 1/2"]
    src: {sheet: foundation, basis: measured, confidence: medium, note: measured on the calibrated plan}

  cp_flue_n:
    at: [14'-6", -9'-10 3/4"]
    src: {sheet: roof, basis: measured, confidence: medium, note: "flue circle on the calibrated roof plan at (14'-6\", -9'-9 1/2\"); the SW elevation puts it at -9'-11 3/4\" and the NW at 14'-6 1/4\". 6 1/4\" south of cp_core_n, inside the core"}
  cp_flue_s:
    at: [16'-10 1/4", -37'-4 1/4"]
    src: {sheet: roof, basis: measured, confidence: medium, note: "flue circle on the calibrated roof plan at (16'-10 3/4\", -37'-3 3/4\"); the SW elevation puts it at -37'-4 3/4\" and the NW at 16'-9 1/2\". 8\" south of cp_core_s, inside the core"}

types:
  materials:
    concrete: {unreal: M_Concrete, color: "#9a968c", texture: {polyhaven: concrete_floor_worn_001}}
    stone_native: {unreal: M_StoneNative, color: "#8a7560", pattern: rubble, texture: {polyhaven: stone_wall}}
    roofing_built_up: {unreal: M_RoofBuiltUp, color: "#5e5852", texture: {polyhaven: gravel}}
    ground_grass: {unreal: M_GroundGrass, color: "#c9a24a", texture: {polyhaven: withered_grass, macro: true, tint: 0.75, value: 0.65}}  # late-summer golden grass
    flue_metal: {unreal: M_MetalFlue, color: "#76797b"}
    redwood: {unreal: M_Redwood, color: "#8b4a32", texture: {polyhaven: rough_wood, tint: 0.45}}
    glass: {unreal: M_Glass, color: "#9fc3cf", translucent: true, opacity: 0.25}
    steel: {unreal: M_SteelPainted, color: "#45484b"}
    door_frame_metal: {unreal: M_DoorFrame, color: "#3d3933"}
    shingle: {unreal: M_ShingleComposition, color: "#4d4a47", pattern: shingles, texture: {polyhaven: roof_slates_02, tint: 0.4, value: 0.38}}
    acrylic: {unreal: M_Acrylic, color: "#dcecf1", translucent: true, opacity: 0.22}

  profiles:
    conc_col:
      # +y points out of the pavilion along the radius; widest at mid-height.
      points: [[2", 8"], [-2", 8"], [-6 3/4", 0"], [-2", -8"], [2", -8"], [6 3/4", 0"]]
      axis_note: long axis radial, +y outward
      src: {sheet: D-1, view: section thru conc. col., basis: dimensioned, confidence: medium,
            quote: "4 3/4\" 2\" 2\" 4 3/4\"; 8\" 8\"; 30° TYP.", note: the notches and the door pockets are omitted}

  components:
    column_typ:
      kind: column
      profile: conc_col
      height: 6'-7 1/2"
      material: concrete
      src: {sheet: D-1, basis: dimensioned, quote: "6'-7 1/2\" TYP. FOR ALL COLS EXCEPT COLS @ TUB - SEE DET."}
    header_6x6:
      kind: beam
      section: [6", 6"]
      material: redwood
      src: {sheet: D-1, basis: rule, quote: "6x6 HEADER CONT. BETWEEN CONC. COLS - BEARS ON CONC. COLS",
            note: "full 6\" deep: 100'-0\" + 6'-7 1/2\" + 6\" gives the 107'-1 1/2\" top of header on the elevation"}
    rafter_4x6:
      kind: beam
      section: [4", 6"]
      material: redwood
      collision: false
      src: {sheet: D-1, basis: rule, quote: "4x6 RAFTER", note: "full-size lumber, like the header"}
    sill_2x6:
      kind: beam
      section: [6", 2"]
      material: redwood
      collision: false
      src: {sheet: D-3, basis: rule, quote: "CONT. 2x6 SILL PL. W/ 1/2\" ANCHOR BOLTS @ 32\" O.C.", note: full-size lumber}
    door_glass:
      kind: panel
      thickness: 1"
      material: glass
      src: {sheet: D-1, basis: measured, quote: "GL. SLIDING DOOR", note: one pane per bay; frames and the fixed/sliding split are omitted}
    roof_glass:
      kind: panel
      thickness: 1"
      material: glass
      src: {sheet: D-1, basis: dimensioned, quote: "1\" TEMPERED INSULATING GLASS PANEL"}
    slab_4in:
      kind: slab
      thickness: 4"
      material: concrete
      src: {sheet: D-1, basis: dimensioned, quote: "4\" CONC. SLAB W/ 6x6/10x10 WIRE MESH REINF."}
    wall_stone_tower:
      kind: wall
      thickness: 1'-0"
      material: stone_native
      src: {sheet: foundation, basis: measured, confidence: low, note: stair tower wall scaled off the calibrated plan}
    wall_hearth:
      kind: wall
      thickness: 9"
      material: stone_native
      src: {sheet: foundation, basis: measured, confidence: low, note: hearth ring scaled off the calibrated plan}
    mass_masonry:
      kind: wall
      thickness: 1'-0"
      material: stone_native
      src: {basis: assumed, note: solid masonry for the round cores}
    wall_stone:
      kind: wall
      thickness: 1'-0"
      facing: 5"
      material: stone_native
      src: {sheet: D-3, basis: dimensioned, confidence: medium, quote: "2 COURSES OF 12\" WIDE MASONRY BLK", note: "12\" block inside the dimensioned face; the stone facing outside it scales about 5\" on the calibrated plan"}
    roof_shingle:
      kind: roof
      thickness: 4 1/2"
      material: shingle
      src: {sheet: roof, basis: assumed, quote: "ROOFING ON 30° SLOPES TO BE COMPOSITION TAB LOCK SHINGLES; ALL ROOF INSULATION TO BE 3\" URETHANE",
            note: "build-up assumed as 3/4\" deck + 3\" insulation + 3/4\" shingles; D-2 has the real one"}
    ring_comp:
      kind: ring
      section: [1", 6"]
      material: steel
      collision: false
      src: {sheet: elevations, basis: assumed, note: "a steel ring where the rafters meet (owner's direction); its size is not on these sheets (D-2)"}
    roof_flat:
      kind: roof
      thickness: 8"
      material: roofing_built_up
      src: {sheet: roof, basis: rule, quote: "ROOFING ON FLAT SURFACES TO BE 4 PLY BUILT-UP ROOF; ALL FLAT ROOFING TO SLOPE 1/4\" PER FT. TO DRAIN BY TAPERING INSULATION",
            note: "8\" thick per D-3 (BUILT-UP ROOF OVER 3\" INSUL.); the 1/4\" per foot drainage taper is not modelled"}
    fascia_1x8:
      kind: beam
      section: [1", 8"]
      material: redwood
      collision: false
      src: {sheet: elevations, basis: assumed, quote: "ALL FRAMING LUMBER TO BE #2 CLOSE GRAIN REDWOOD", note: "the conical roofs' edge is drawn as a band over the rafter ends; board size assumed"}
    trim_1x10:
      kind: beam
      section: [1", 10"]
      material: redwood
      collision: false
      src: {sheet: D-3, basis: dimensioned, quote: "1\"x10\" WD. TRIM EA SIDE OF PL.", note: closes the space between the top of masonry and the roof}
    door_frame:
      kind: beam
      section: [2", 4"]
      material: door_frame_metal
      collision: false
      src: {sheet: D-1, basis: assumed, quote: "GLASS SLIDING DOOR FRAME", note: "frame and sash sizes assumed (2\" x 4\" frame, 2 1/2\" stiles, 4\" bottom rail); dark bronze assumed"}
    blocking_2x4:
      kind: beam
      section: [2", 4"]
      material: redwood
      collision: false
      src: {sheet: D-1, basis: dimensioned, quote: "CONT. BLK. CUT FROM 2x4", note: fills from the top of header up to the glass between the rafters}
    trellis_bracket:
      kind: beam
      section: [4", 4"]
      material: redwood
      collision: false
      src: {sheet: D-1, basis: dimensioned, quote: "2-4x4 TRELLIS SUPPORT BRACKET - BOLTS THRU 4x6 RAFTER"}
    trellis_slat:
      kind: beam
      section: [2", 2"]
      material: redwood
      collision: false
      src: {sheet: D-1, basis: dimensioned, quote: "2x2 TRELLIS @ 2'-0\" O.C."}
    lantern_post:
      kind: beam
      section: [4", 4"]
      material: redwood
      src: {sheet: elevations, basis: assumed, note: "posts of the living room's clerestory; size assumed"}
    glass_fixed:
      kind: panel
      thickness: 1"
      material: glass
      src: {sheet: elevations, basis: measured, confidence: low, quote: "FIXED GL."}
    skylight_glass:
      kind: panel
      thickness: 1"
      material: glass
      src: {sheet: roof, basis: dimensioned, quote: "ALL SKYLIGHTS TO BE 2 LAYERS OF TEMPERED 1/4\" GLASS W/ 1/2\" AIRSPACE"}
    skylight_frame:
      kind: beam
      section: [4", 4"]
      material: redwood
      collision: false
      src: {sheet: roof, basis: assumed, quote: "ALL FRAMING LUMBER TO BE #2 CLOSE GRAIN REDWOOD", note: "member size assumed; the ridge beam's turned-up ends on the NW elevation are drawn straight"}
    flue_pipe:
      kind: flue
      diameter: 1'-0"
      cap_diameter: 1'-7"
      material: flue_metal
      src: {sheet: elevations, basis: measured, confidence: medium, quote: "FIREPLACE FLUE", note: "pipe scales 12 to 13 1/2\" and ball 18 1/2 to 19 1/2\" across on the two elevations; material assumed"}
    skylight_dome:
      kind: dome
      rise: 1'-0"
      material: acrylic
      collision: false
      src: {sheet: elevations, basis: measured, quote: "ACRYLIC DOME SKYLIGHT (SEE D-2) TYP.", note: rise scaled off the SW elevation}

elements:
  - id: pav_tl
    pattern: radial_pavilion
    name: North-west bedroom pavilion (phase 0's pavilion A, now in place)
    center: cp_tl
    floor: ff_bedroom
    plan:
      sides: 6
      side: 8'-10"
      rotation: 0deg
      src: {sheet: foundation, basis: dimensioned, quote: "8'-10\" TYP. BET. COL. C.P.'S", note: rotation read from the column positions on the calibrated plan}
    glazed_sides: [0, 1, 2]
    columns: {type: column_typ}
    header: {type: header_6x6, top: t_o_header, blocking: blocking_2x4}
    doors:
      type: door_glass
      frame: door_frame
      panels: 2
      src: {sheet: elevations, basis: measured, confidence: low, quote: "TEMP. GLASS SLIDING DOOR"}
    stone_arcs:
      - type: wall_stone
        radius_outside: 11'-8"
        start: 238deg
        end: 303deg
        top: t_o_masonry_bedroom
        src: {sheet: foundation, basis: measured, confidence: medium, quote: "11'-8\" TYP. RAD. TO O.S. FACE OF BLK", note: radius dimensioned; arc ends measured on the calibrated plan}
    slab:
      type: slab_4in
      edge_offset: 8"
      src: {basis: assumed, note: "slab edge carried 8\" past the glazing line to take the columns"}
    trellis:
      bracket: trellis_bracket
      reach: 3'-4"
      slat: trellis_slat
      spacing: 1'-0"
      src: {sheet: D-1, basis: dimensioned, confidence: medium, quote: "3'-4\" TO O.S. OF BRACKET; 2x2 TRELLIS @ 2'-0\" O.C.; RDWD. TRELLIS",
            note: "the slats are lettered 2'-0\" on center, but D-1 and the roof plan both draw them about 1'-0\" apart, three to a side"}
    roof:
      glazed:
        panel: roof_glass
        pitch: 30deg
        src: {sheet: roof, basis: rule, quote: "ROOFING ON 30° SLOPES", note: the drawn slope on the SW elevation agrees}
      conical:
        type: roof_shingle
        eave_overhang: 1'-0"
        nominal_pitch: 30deg
        src: {sheet: elevations, basis: measured, note: overhang scaled off the NW elevation}
      sill: {type: sill_2x6}
      rafters:
        type: rafter_4x6
        cone_spacing: 7.5deg
        src: {sheet: roof, basis: measured, quote: "4x6 RAFTERS TYPICAL", note: spacing on the curved side approximated}
      eave: {fascia: fascia_1x8, frieze: trim_1x10, src: {sheet: D-3, basis: rule, quote: "1\"x10\" WD. TRIM EA SIDE OF PL.", note: "frieze from D-3; fascia over the rafter ends as the elevations draw the eave"}}
      ring:
        type: ring_comp
        curb: 5"
        top: t_o_ring_bedroom
        measured_radius: 2'-3"
        measured_src: {sheet: elevations, basis: measured, confidence: low, note: "dome scales 4'-0\" to 4'-10\" across on the SW elevation"}
      skylight: {type: skylight_dome}
  - id: pav_tr
    pattern: radial_pavilion
    name: North-east pavilion
    center: cp_tr
    floor: ff_bedroom
    plan:
      sides: 6
      side: 8'-10"
      rotation: 30deg
      src: {sheet: foundation, basis: dimensioned, quote: "8'-10\" TYP. BET. COL. C.P.'S", note: rotation read from the column positions on the calibrated plan}
    glazed_sides: [5, 0, 1]
    columns: {type: column_typ}
    header: {type: header_6x6, top: t_o_header, blocking: blocking_2x4}
    doors:
      type: door_glass
      frame: door_frame
      panels: 2
      src: {sheet: elevations, basis: measured, confidence: low, quote: "TEMP. GLASS SLIDING DOOR"}
    stone_arcs:
      - type: wall_stone
        radius_outside: 11'-8"
        start: 208deg
        end: 331deg
        top: t_o_masonry_bedroom
        src: {sheet: foundation, basis: measured, confidence: medium, quote: "11'-8\" TYP. RAD. TO O.S. FACE OF BLK", note: radius dimensioned; arc ends measured on the calibrated plan}
    slab:
      type: slab_4in
      edge_offset: 8"
      src: {basis: assumed, note: "slab edge carried 8\" past the glazing line to take the columns"}
    trellis:
      bracket: trellis_bracket
      reach: 3'-4"
      slat: trellis_slat
      spacing: 1'-0"
      src: {sheet: D-1, basis: dimensioned, confidence: medium, quote: "3'-4\" TO O.S. OF BRACKET; 2x2 TRELLIS @ 2'-0\" O.C.; RDWD. TRELLIS",
            note: "the slats are lettered 2'-0\" on center, but D-1 and the roof plan both draw them about 1'-0\" apart, three to a side"}
    roof:
      glazed:
        panel: roof_glass
        pitch: 30deg
        src: {sheet: roof, basis: rule, quote: "ROOFING ON 30° SLOPES", note: the drawn slope on the SW elevation agrees}
      conical:
        type: roof_shingle
        eave_overhang: 1'-0"
        nominal_pitch: 30deg
        src: {sheet: elevations, basis: measured, note: overhang scaled off the NW elevation}
      sill: {type: sill_2x6}
      rafters:
        type: rafter_4x6
        cone_spacing: 7.5deg
        src: {sheet: roof, basis: measured, quote: "4x6 RAFTERS TYPICAL", note: spacing on the curved side approximated}
      eave: {fascia: fascia_1x8, frieze: trim_1x10, src: {sheet: D-3, basis: rule, quote: "1\"x10\" WD. TRIM EA SIDE OF PL.", note: "frieze from D-3; fascia over the rafter ends as the elevations draw the eave"}}
      ring:
        type: ring_comp
        curb: 5"
        top: t_o_ring_bedroom
        src: {basis: assumed, note: top of ring taken as the bedroom pavilion's}
      skylight: {type: skylight_dome}
  - id: pav_center
    pattern: radial_pavilion
    name: Center pavilion
    center: cp_center
    floor: ff_bedroom
    plan:
      sides: 6
      side: 6'-10"
      rotation: 30deg
      src: {sheet: foundation, basis: dimensioned, quote: "6'-10\" TYP. BET. COL. C.P.'S", note: rotation read from the column positions on the calibrated plan}
    glazed_sides: [5, 0, 1]
    columns: {type: column_typ}
    header: {type: header_6x6, top: t_o_header, blocking: blocking_2x4}
    doors:
      type: door_glass
      frame: door_frame
      panels: 2
      src: {sheet: elevations, basis: measured, confidence: low, quote: "TEMP. GLASS SLIDING DOOR"}
    stone_arcs:
      - type: wall_stone
        radius_outside: 8'-0"
        start: 178deg
        end: 268deg
        top: t_o_masonry_bedroom
        src: {sheet: foundation, basis: measured, confidence: medium, quote: "8'-0\" RAD. TO O.S. FACE OF BLK", note: radius dimensioned; arc ends measured on the calibrated plan}
    slab:
      type: slab_4in
      edge_offset: 8"
      src: {basis: assumed, note: "slab edge carried 8\" past the glazing line to take the columns"}
    trellis:
      bracket: trellis_bracket
      reach: 3'-4"
      slat: trellis_slat
      spacing: 1'-0"
      src: {sheet: D-1, basis: dimensioned, confidence: medium, quote: "3'-4\" TO O.S. OF BRACKET; 2x2 TRELLIS @ 2'-0\" O.C.; RDWD. TRELLIS",
            note: "the slats are lettered 2'-0\" on center, but D-1 and the roof plan both draw them about 1'-0\" apart, three to a side"}
    roof:
      glazed:
        panel: roof_glass
        pitch: 30deg
        src: {sheet: roof, basis: rule, quote: "ROOFING ON 30° SLOPES"}
      conical:
        type: roof_shingle
        eave_overhang: 1'-0"
        nominal_pitch: 30deg
        src: {sheet: elevations, basis: assumed, note: overhang as on the large pavilions}
      sill: {type: sill_2x6}
      rafters:
        type: rafter_4x6
        cone_spacing: 10deg
        src: {sheet: roof, basis: measured, quote: "4x6 RAFTERS TYPICAL", note: spacing approximated}
      eave: {fascia: fascia_1x8, frieze: trim_1x10, src: {sheet: D-3, basis: rule, quote: "1\"x10\" WD. TRIM EA SIDE OF PL.", note: "frieze from D-3; fascia over the rafter ends as the elevations draw the eave"}}
      ring:
        type: ring_comp
        curb: 5"
        radius: 1'-6"
        src: {sheet: roof, basis: assumed, note: "no top of ring is lettered for the small pavilions; radius assumed, top derived from the 30 degree pitch"}
      skylight: {type: skylight_dome}
  - id: pav_br
    pattern: radial_pavilion
    name: South-east pavilion
    center: cp_br
    floor: ff_bedroom
    plan:
      sides: 6
      side: 6'-10"
      rotation: 0deg
