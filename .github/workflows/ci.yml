name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries the bpy wheel links against
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglx0 libsm6 libice6 libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxkbcommon0 libxcb1
      - name: Install
        run: pip install -e ".[dev,blender,sheets,reader]"
      - name: Test (includes the Blender round trip)
        run: pytest -q
      - name: Build the example house
        run: |
          aw build projects/example-house/pavilion_a.yaml
          aw build projects/example-house/house.yaml
      - name: Draft the foundation plan from the hand reading and score it
        run: |
          aw detect projects/example-house/sheets/foundation-plan.jpg
          aw draft projects/example-house/readings/foundation-plan.hand.json projects/example-house/sheets/foundation-plan.jpg --score projects/example-house/house.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: example-house
          path: |
            projects/example-house/out/pavilion_a
            projects/example-house/out/house
            projects/example-house/out/reader
