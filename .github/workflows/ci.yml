name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries the bpy wheel links against
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglx0 libsm6 libice6 libx11-6 libxext6 libxfixes3 libxi6 libxrender1 libxkbcommon0 libxcb1
      - name: Install
        run: pip install -e ".[dev,blender]"
      - name: Test (includes the Blender round trip)
        run: pytest -q
      - name: Build the example
        run: aw build projects/example-house/pavilion_a.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: example-house-pavilion-a
          path: projects/example-house/out/pavilion_a
